<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#6938ef"/>
<title>Pobierz Recomly</title>
<script>
  (function () {
    var LIVE = false;
    var APP_STORE = 'https://apps.apple.com/app/id6772970281';
    var PLAY = 'https://play.google.com/store/apps/details?id=com.recomly.app';
    if (!LIVE) return;
    document.documentElement.className = 'live';
    var ua = navigator.userAgent;
    var isIPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (isIPad || /iPhone|iPod/.test(ua)) location.replace(APP_STORE);
    else if (/Android/.test(ua) && !/HuaweiBrowser/.test(ua)) location.replace(PLAY);
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<style>
  :root { --primary: #6938ef; --text: #0f0b1f; --muted: #6b6580; --border: #ece8f5; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #ffffff 0%, #ffffff 70%, #f5f0ff 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    text-align: center;
  }
  main { max-width: 420px; width: 100%; }
  .logo { height: 40px; width: auto; margin-bottom: 28px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
  p { color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
  .stores { display: flex; flex-direction: column; gap: 12px; }
  .store {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #000; color: #fff; text-decoration: none;
    padding: 14px 20px; border-radius: 14px; font-weight: 600; font-size: 16px;
  }
  .store:hover { opacity: 0.85; }
  .store.cta { background: var(--primary); }
  .live-only, html.live .soon-only { display: none; }
  html.live .live-only { display: block; }
  html.live .stores.live-only { display: flex; }
  .store svg { width: 22px; height: 22px; flex-shrink: 0; }
  .back { display: inline-block; margin-top: 28px; color: var(--primary); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Recomly" class="logo"/>
  <div class="soon-only">
    <h1 data-i18n="soonTitle">Już wkrótce</h1>
    <p data-i18n="soonSubtitle">Recomly niedługo pojawi się w App Store i Google Play. Zapisz się, a damy Ci znać.</p>
    <div class="stores">
      <a class="store cta" href="/#waitlist" data-i18n="soonCta">Zapisz się na listę</a>
    </div>
  </div>
  <h1 class="live-only" data-i18n="title">Pobierz Recomly</h1>
  <p class="live-only" data-i18n="subtitle">Rekomendacje restauracji i kawiarni od ludzi, którym ufasz.</p>
  <div class="stores live-only">
    <a class="store" href="https://apps.apple.com/app/id6772970281">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 1.43c0 1.14-.42 2.2-1.25 3.06-.9.94-1.98 1.48-3.15 1.39-.15-1.1.42-2.27 1.2-3.06.88-.9 2.36-1.56 3.2-1.39zM20.5 17.1c-.55 1.27-.82 1.84-1.53 2.97-.99 1.57-2.39 3.53-4.12 3.54-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.73-.02-3.05-1.79-4.04-3.36C-.06 15.86-.35 10.6 1.46 7.83c1.29-1.97 3.32-3.12 5.23-3.12 1.95 0 3.17 1.07 4.78 1.07 1.56 0 2.51-1.07 4.77-1.07 1.7 0 3.5.93 4.79 2.53-4.21 2.31-3.53 8.32-.53 9.86z"/></svg>
      <span>App Store</span>
    </a>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.recomly.app">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1 9.9-9.9v-.2L3.7 1.7l-.1.1zm13.3 13.9-3.3-3.3v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2h-.1zm-.1.1L13.4 12l-9.8 9.8c.4.4 1 .4 1.7.1l11.5-6.1zM16.8 8.2 5.3 2.1c-.7-.4-1.3-.3-1.7.1l9.8 9.8 3.4-3.8z"/></svg>
      <span>Google Play</span>
    </a>
  </div>
  <a href="/" class="back" data-i18n="back">recomly.app</a>
</main>
<script>
  (function () {
    var t = {
      en: {
        title: 'Get Recomly',
        subtitle: 'Restaurant and cafe recommendations from people you trust.',
        soonTitle: 'Coming soon',
        soonSubtitle: "Recomly is coming to the App Store and Google Play soon. Join the waitlist and we'll let you know.",
        soonCta: 'Join the waitlist',
        back: 'recomly.app'
      }
    };
    var lang;
    try { lang = localStorage.getItem('recomly-lang'); } catch (e) {}
    if (!lang) lang = (navigator.language || 'pl').slice(0, 2) === 'pl' ? 'pl' : 'en';
    if (lang !== 'en') return;
    document.documentElement.lang = 'en';
    document.title = t.en.title;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t.en[el.getAttribute('data-i18n')];
    });
  })();
</script>
</body>
</html>
